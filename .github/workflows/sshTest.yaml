name: SSH Connectivity Test

on:
  workflow_dispatch:
    # Pour lancer manuellement le test depuis l'interface GitHub

jobs:
  ssh-test:
    runs-on: ubuntu-latest

    steps:
    - name: Afficher la version de l'OS
      run: uname -a

    - name: Setup SSH and Test Connection
      run: |
        echo "Création du dossier SSH"
        mkdir -p ~/.ssh

        echo "Écriture de la clé privée"
        echo "${{ secrets.TEST_CICD_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key

        echo "Permissions de la clé"
        chmod 600 ~/.ssh/deploy_key

        echo "Lancement de l'agent SSH"
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/deploy_key

        echo "Ajout de l'hôte au known_hosts"
        ssh-keyscan -H ${{ secrets.TEST_CICD_SSH_HOST }} >> ~/.ssh/known_hosts

        echo "Tentative de connexion SSH"
        ssh -vvv -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.TEST_CICD_SSH_USER }}@${{ secrets.TEST_CICD_SSH_HOST }} "echo '✅ Connexion SSH réussie !'"
