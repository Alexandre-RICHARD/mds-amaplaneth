name: CI/CD Deployment

on:
  push:
    branches:
    - 'test-CI-CD'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Deploy on VPS
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.TEST_CICD_SSH_HOST }}
        username: ${{ secrets.TEST_CICD_SSH_USER }}
        key: ${{ secrets.TEST_CICD_SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd ${{ secrets.TEST_CICD_TARGET_FOLDER }}
          echo "ca fonctionne"
